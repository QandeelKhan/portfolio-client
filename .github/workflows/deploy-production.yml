name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy Resume Client to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Trigger Infrastructure Deployment
        env:
          GITHUB_TOKEN: ${{ secrets.INFRASTRUCTURE_DEPLOY_TOKEN }}
        run: |
          echo "Resume client production branch updated"
          echo "Triggering infrastructure deployment workflow..."
          
          # Trigger the infrastructure repo's deployment workflow
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/QandeelKhan/propertier-infrastructure/dispatches \
            -d '{"event_type":"resume-client-deploy","client_payload":{"component":"resume-client","branch":"production","triggered_by":"'"$GITHUB_ACTOR"'"}}'
          
          echo "✓ Infrastructure deployment triggered"

      - name: Notify Deployment Started
        run: |
          echo "========================================="
          echo "Resume Client Production Deployment Initiated"
          echo "========================================="
          echo "Component: Resume Client"
          echo "Branch: production"
          echo "Commit: $GITHUB_SHA"
          echo "Triggered by: $GITHUB_ACTOR"
          echo ""
          echo "Check infrastructure repo for deployment progress:"
          echo "https://github.com/QandeelKhan/propertier-infrastructure/actions"
          echo "========================================="
